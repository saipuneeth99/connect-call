name: connect_call
description: "ConnectCall - Connect with anyone, anywhere. A 1-to-1 audio/video calling application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  intl: ^0.20.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^6.2.2
  supabase_flutter: ^2.17.2
  livekit_client: ^2.12.0
  dart_jsonwebtoken: ^3.4.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
